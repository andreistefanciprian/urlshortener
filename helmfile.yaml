# Helmfile for URL Shortener Application
# This file defines the deployment of the complete URL shortener application stack

# Helm repositories
repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

# Global configuration
helmDefaults:
  # Wait for deployments to be ready
  wait: true
  # Timeout for deployments
  timeout: 300
  # Force resource updates
  force: false
  # Recreate pods when needed
  recreatePods: false

# Define the releases
releases:
  - name: pg
    namespace: postgres
    createNamespace: true
    chart: bitnami/postgresql
    version: 15.5.14
    values:
      - image:
          tag: "latest"
          debug: true
        auth:
          enablePostgresUser: true
          username: url_gen_user
          replicationUsername: repl_user
          database: urls
          existingSecret: "pg-creds"
          secretKeys:
            adminPasswordKey: admin-password
            userPasswordKey: user-password
            replicationPasswordKey: replication-password
        primary:
          persistence:
            enabled: true
            size: 1Gi
          initdb:
            scriptsConfigMap: db-init-sql
    hooks:
      - events: ["presync"]
        showlogs: true
        command: sh
        args:
          - -c
          - |
            kubectl -n postgres create configmap db-init-sql \
              --from-file=init.sql=init.sql \
              --dry-run=client -o yaml | kubectl apply -f -

  # Redis (for caching) - single-node for dev
  - name: redis
    namespace: redis
    createNamespace: true
    chart: bitnami/redis
    values:
      - architecture: standalone
      - auth:
          enabled: true
          existingSecret: redis-creds
          existingSecretPasswordKey: redis-password
      - master:
          persistence:
            enabled: true
            size: 1Gi
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying Redis (standalone, no auth) ..."]
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["Redis deployed"]

  # URL Generation Service - gRPC backend service
  - name: url-gen
    namespace: url-gen
    createNamespace: true
    chart: ./url-gen/infra/url-gen
    values:
      - ./url-gen/infra/url-gen/values.yaml
    set:
      # Override default values if needed
      - name: config.LOG_LEVEL
        value: DEBUG
      - name: config.DB_HOST
        value: pg-postgresql.postgres.svc
      - name: config.REDIS_HOST
        value: redis-master.redis
      - name: config.REDIS_DB
        value: "0"
    # Hooks for lifecycle management
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying URL Generation Service..."]
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["URL Generation Service deployed successfully"]
    # URL Gen depends on PostgreSQL being ready
    needs:
      - postgres/pg
      - redis/redis

  # URL Reading Service - gRPC backend service
  - name: url-read
    namespace: url-read
    createNamespace: true
    chart: ./url-read/infra/url-read
    values:
      - ./url-read/infra/url-read/values.yaml
    set:
      - name: config.DB_USER
        value: url_gen_user
      - name: config.LOG_LEVEL
        value: DEBUG
      - name: config.DB_HOST
        value: pg-postgresql.postgres.svc
      - name: config.REDIS_HOST
        value: redis-master.redis
      - name: config.REDIS_DB
        value: "0"
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying URL Reading Service..."]
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["URL Reading Service deployed successfully"]
    needs:
      - postgres/pg
      - redis/redis

  # API Gateway Service
  - name: api-gateway
    namespace: api-gateway
    createNamespace: true
    chart: ./api-gateway/infra/api-gateway
    values:
      - ./api-gateway/infra/api-gateway/values.yaml
    set:
      # Override default values if needed
      - name: config.LOG_LEVEL
        value: DEBUG
      - name: config.URL_GEN_HOST
        value: url-gen.url-gen.svc
      - name: config.URL_READ_HOST
        value: url-read.url-read.svc
    # Hooks for lifecycle management
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying API Gateway..."]
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["API Gateway deployed successfully"]
    # API Gateway depends on URL Gen and URL Read being ready
    needs:
      - url-gen/url-gen
      - url-read/url-read

  # Frontend Service
  - name: frontend
    namespace: frontend
    chart: ./frontend/infra/frontend
    values:
      - ./frontend/infra/frontend/values.yaml
    set:
      # Override default values if needed
      - name: config.LOG_LEVEL
        value: DEBUG
      - name: config.BACKEND_HOST
        value: api-gateway.api-gateway.svc
    # Hooks for lifecycle management
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "echo"
        args: ["Deploying Frontend..."]
      - events: ["postsync"]
        showlogs: true
        command: "echo"
        args: ["Frontend deployed successfully"]
    # Frontend depends on API Gateway being ready
    needs:
      - api-gateway/api-gateway
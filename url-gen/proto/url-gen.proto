syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "github.com/andreistefanciprian/urlshortener/url-gen/proto";

service URLGenerator {
    rpc GenerateShortURL(ShortURLRequest) returns (ShortURLResponse);
    rpc DeleteShortURL(DeleteShortURLRequest) returns (DeleteShortURLResponse);
}
message ShortURLRequest {
    string long_url = 1;
    google.protobuf.Timestamp expiration = 2; // Optional expiration date
}

message ShortURLResponse {
    string short_url = 1;
}

message DeleteShortURLRequest {
    string short_url_code = 1;
}

message DeleteShortURLResponse {
    bool success = 1;
    string message = 2; // Optional message for additional context
}
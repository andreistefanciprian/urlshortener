syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "github.com/andreistefanciprian/urlshortener/url-read/proto";

service URLReader {
    rpc GetLongURL(LongURLRequest) returns (LongURLResponse);
}

message LongURLRequest {
    string short_url = 1;
}

message LongURLResponse {
    string long_url = 1;
    google.protobuf.Timestamp expiration = 2; // Optional expiration date
}
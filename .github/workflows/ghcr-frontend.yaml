name: Frontend - Build & Push to GHCR

# Trigger conditions
on:
  push:
    tags:
      - 'frontend-v*'
    branches:
      - 'main'
    paths:
      - 'frontend/go.*'
      - 'frontend/**/*.go'
      - 'frontend/**/*.tmpl'
      - 'frontend/infra/Dockerfile'
      - '.github/workflows/ghcr-frontend.yaml'
      - 'frontend/version.txt'
      - 'frontend/CHANGELOG.md'

  pull_request:
    branches:
      - 'main'
    paths:
      - 'frontend/go.*'
      - 'frontend/**/*.go'
      - 'frontend/**/*.tmpl'
      - 'frontend/infra/Dockerfile'
      - '.github/workflows/ghcr-frontend.yaml'
  
  workflow_dispatch:

# Required permissions
permissions:
  contents: write       # Read repo contents + upload SBOM to releases
  id-token: write       # Generate OIDC tokens
  attestations: write   # Create attestations
  packages: write       # Push to GHCR

jobs:
  # Run go vet
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'
          cache-dependency-path: frontend/go.sum

      - name: Install dependencies
        working-directory: ./frontend
        run: go mod download

      - name: Run go vet
        working-directory: ./frontend
        run: go vet ./...

      - name: Run gofmt
        working-directory: ./frontend
        run: test -z "$(gofmt -l .)"

  # Generate unique build identifier
  generate-build-id:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      BUILD_ID: ${{ steps.prep.outputs.BUILD_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Generate build ID
        id: prep
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "BUILD_ID=${GITHUB_REF_NAME#frontend-v}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pr_number=${GITHUB_REF_NAME%/merge}
            sha=${GITHUB_SHA::8}
            echo "BUILD_ID=pr-${pr_number}-${sha}" >> $GITHUB_OUTPUT
          else
            branch=${GITHUB_REF##*/}
            sha=${GITHUB_SHA::8}
            ts=$(date +%s)
            echo "BUILD_ID=${branch}-${sha}-${ts}" >> $GITHUB_OUTPUT
          fi

  # Build, scan, sign, and push Docker image to GHCR
  docker:
    needs: [generate-build-id]
    uses: andreistefanciprian/gh-reusable-workflows/.github/workflows/build_and_push_docker_image_to_ghcr.yaml@main
    with:
      # Image configuration
      image_name: ghcr.io/andreistefanciprian/frontend
      image_tag: ${{ needs.generate-build-id.outputs.BUILD_ID }}
      file: frontend/infra/Dockerfile
      context: ./frontend

      # Tagging options
      push_latest: ${{ github.ref == 'refs/heads/main' }}

      # Security scanning
      trivy_scan: true
      trivy_scan_severity: CRITICAL,HIGH
      trivy_ignore_unfixed: true

      # Signing and attestation
      cosign_sign: true
      cosign_attest_sbom: true
    secrets: inherit

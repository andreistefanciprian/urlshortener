name: Frontend - Build & Push to GHCR

# Trigger conditions
on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
    paths:
      - 'frontend/go.*'
      - 'frontend/**/*.go'
      - 'frontend/**/*.tmpl'
      - 'frontend/infra/Dockerfile'
      - '.github/workflows/ghcr-frontend.yaml'
  
  pull_request:
    branches:
      - 'main'
    paths:
      - 'frontend/go.*'
      - 'frontend/**/*.go'
      - 'frontend/**/*.tmpl'
      - 'frontend/infra/Dockerfile'
      - '.github/workflows/ghcr-frontend.yaml'
  
  workflow_dispatch:

# Required permissions
permissions:
  contents: read        # Read repository contents
  id-token: write       # Generate OIDC tokens
  attestations: write   # Create attestations
  packages: write       # Push to GHCR

jobs:
  # Generate unique build identifier
  generate-build-id:
    runs-on: ubuntu-latest
    outputs:
      BUILD_ID: ${{ steps.prep.outputs.BUILD_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Generate build ID
        id: prep
        run: |
          branch=${GITHUB_REF##*/}
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "BUILD_ID=${branch}-${sha}-${ts}" >> $GITHUB_OUTPUT

  # Build, scan, sign, and push Docker image to GHCR
  docker:
    needs: [generate-build-id]
    uses: andreistefanciprian/gh-reusable-workflows/.github/workflows/build_and_push_docker_image_to_ghcr.yaml@4edccbae4a1d9429acaf5face1acb5126d0d96c1
    with:
      # Image configuration
      image_name: ghcr.io/andreistefanciprian/frontend
      image_tag: ${{ needs.generate-build-id.outputs.BUILD_ID }}
      file: frontend/infra/Dockerfile
      context: ./frontend
      
      # Tagging options
      push_latest: ${{ github.ref == 'refs/heads/main' }}
      
      # Security scanning
      scan_severity: CRITICAL,HIGH
      ignore_unfixed: true
      
      # Signing and attestation
      cosign_sign: true
      cosign_attest_sbom: true
    secrets: inherit

name: API Gateway - Build & Push to GHCR

# Trigger conditions
on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
    paths:
      - 'api-gateway/go.*'
      - 'api-gateway/**/*.go'
      - 'api-gateway/infra/Dockerfile'
      - '.github/workflows/docker-api-gateway-ghcr.yaml'
  
  pull_request:
    branches:
      - 'main'
    paths:
      - 'api-gateway/go.*'
      - 'api-gateway/**/*.go'
      - 'api-gateway/infra/Dockerfile'
      - '.github/workflows/docker-api-gateway-ghcr.yaml'
  
  workflow_dispatch:

# Required permissions
permissions:
  contents: read        # Read repository contents
  id-token: write       # Generate OIDC tokens
  attestations: write   # Create attestations
  packages: write       # Push to GHCR

jobs:
  # Run unit tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'
          cache-dependency-path: api-gateway/go.sum

      - name: Install dependencies
        working-directory: ./api-gateway
        run: go mod download

      - name: Run unit tests
        working-directory: ./api-gateway
        run: go test -v ./cmd

  # Generate unique build identifier
  generate-build-id:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      BUILD_ID: ${{ steps.prep.outputs.BUILD_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Generate build ID
        id: prep
        run: |
          branch=${GITHUB_REF##*/}
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "BUILD_ID=${branch}-${sha}-${ts}" >> $GITHUB_OUTPUT

  # Build, scan, sign, and push Docker image to GHCR
  docker:
    needs: [generate-build-id]
    uses: andreistefanciprian/gh-reusable-workflows/.github/workflows/build_and_push_docker_image_to_ghcr.yaml@main
    with:
      # Image configuration
      image_name: ghcr.io/andreistefanciprian/api-gateway
      image_tag: ${{ needs.generate-build-id.outputs.BUILD_ID }}
      file: api-gateway/infra/Dockerfile
      context: ./api-gateway
      
      # Tagging options
      push_latest: ${{ github.ref == 'refs/heads/main' }}
      
      # Security scanning
      scan_severity: CRITICAL,HIGH
      ignore_unfixed: true
      
      # Signing and attestation
      cosign_sign: true
      cosign_attest_sbom: true
    secrets: inherit
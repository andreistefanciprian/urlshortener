name: api-gateway image build and push to DockerHub

on:
  push:
    tags:
      - 'api-gateway-v*'
    branches:
      - 'main'
    paths:
      - 'api-gateway/go.*'
      - 'api-gateway/**/*.go'
      - 'api-gateway/infra/Dockerfile'
      - '.github/workflows/docker-api-gateway.yaml'
  pull_request:
    branches: [ 'main' ]
    paths:
      - 'api-gateway/go.*'
      - 'api-gateway/**/*.go'
      - 'api-gateway/infra/Dockerfile'
      - '.github/workflows/docker-api-gateway.yaml'
  workflow_dispatch:
  
permissions:
  contents: read
  id-token: write
  attestations: write
  
jobs:


  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.1'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('api-gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: ./api-gateway
        run: go mod download

      - name: Run go vet
        working-directory: ./api-gateway
        run: go vet ./cmd/...

      - name: Run gofmt
        working-directory: ./api-gateway
        run: test -z "$(gofmt -l .)"

      - name: Run unit tests
        working-directory: ./api-gateway
        run: go test -v ./cmd

  generate-build-id:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      BUILD_ID: ${{ steps.prep.outputs.BUILD_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Generate build ID
        id: prep
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "BUILD_ID=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            branch=${GITHUB_REF##*/}
            sha=${GITHUB_SHA::8}
            ts=$(date +%s)
            echo "BUILD_ID=${branch}-${sha}-${ts}" >> $GITHUB_OUTPUT
          fi

  docker:
    needs: [generate-build-id]
    uses: andreistefanciprian/gh-reusable-workflows/.github/workflows/build_and_push_docker_image_to_dockerhub.yaml@main
    with:
      image_name: andreistefanciprian/urlshortener-api-gateway
      image_tag: ${{ needs.generate-build-id.outputs.BUILD_ID }}
      dockerhub_username: andreistefanciprian
      file: api-gateway/infra/Dockerfile
      context: ./api-gateway
    secrets: inherit
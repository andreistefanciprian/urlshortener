apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-read
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd-image-updater.argoproj.io/image-list: urlread=andreistefanciprian/urlshortener-url-read
    argocd-image-updater.argoproj.io/urlread.update-strategy: digest
    argocd-image-updater.argoproj.io/urlread.helm.parameters: "-p image.repository=%(image) -p image.digest=%(digest)"
spec:
  project: urlshortener
  sources:
    - repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/url-read
      chart: url-read
      targetRevision: 0.1.9
      helm:
        valueFiles:
          - $values/url-read.values.yaml
    - repoURL: https://github.com/andreistefanciprian/urlshortener.git
      targetRevision: main
      ref: values
      path: k8s/values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-read
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-read
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  argocd-image-updater.argoproj.io/image-list: andreistefanciprian/urlshortener-url-read:latest
    argocd-image-updater.argoproj.io/update-strategy: digest
    argocd-image-updater.argoproj.io/helm.image-name: image.repository
    argocd-image-updater.argoproj.io/helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/helm.image-digest: image.digest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/pull-request: "true"
    argocd-image-updater.argoproj.io/pull-request.target-branch: main
    argocd-image-updater.argoproj.io/git-branch: image-updater-{{.SHA256}}
spec:
  project: urlshortener
  sources:
    - repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/url-read
      chart: url-read
      targetRevision: 0.1.9
      helm:
        valueFiles:
          - $values/url-read.values.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/andreistefanciprian/urlshortener.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-read
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

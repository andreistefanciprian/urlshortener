apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Image updates managed by Renovate (helm-values); no Argo CD Image Updater annotations
spec:
  project: urlshortener
  source:
    repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/api-gateway
    chart: api-gateway
    targetRevision: 0.1.15
    helm:
      values: |
        image:
          repository: andreistefanciprian/urlshortener-api-gateway
          tag: latest@sha256:3ccd59d8219999d2fd4e34a9a7c903939f607dabc59bb4a4601cdf1cab9c0747
        config:
          LOG_LEVEL: DEBUG
          URL_GEN_HOST: url-gen.url-gen.svc
          URL_GEN_PORT: "50052"
          URL_READ_HOST: url-read.url-read.svc
          URL_READ_PORT: "50053"
          API_GATEWAY_PORT: "8080"
          METRICS_PORT: "9090"
          DOMAIN_NAME: "l.it"
  destination:
    server: https://kubernetes.default.svc
    namespace: api-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

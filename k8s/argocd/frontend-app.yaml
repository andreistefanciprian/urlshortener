apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: urlshortener
  source:
    repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/frontend
    chart: frontend
    targetRevision: 0.1.2 # set to the chart version you want to deploy
    helm:
      values: |
        image:
repository: docker.io/andreistefanciprian/urlshortener-frontend
digest: sha256:dbfcad371bd0be9e12279ac80426aa1014513434dc09f2e859db32d0e458a532
        config:
          LOG_LEVEL: DEBUG
          BACKEND_HOST: api-gateway.api-gateway.svc
          BACKEND_PORT: "8080"
          FRONTEND_PORT: "8090"
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

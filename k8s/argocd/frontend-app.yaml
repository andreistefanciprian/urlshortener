apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: andreistefanciprian/urlshortener-frontend:latest
    argocd-image-updater.argoproj.io/update-strategy: digest
    argocd-image-updater.argoproj.io/helm.image-name: image.repository
    argocd-image-updater.argoproj.io/helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/helm.image-digest: image.digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-repository: https://github.com/andreistefanciprian/urlshortener.git
    argocd-image-updater.argoproj.io/pull-request: "true"
    argocd-image-updater.argoproj.io/pull-request.target-branch: main
    argocd-image-updater.argoproj.io/git-branch: image-updater-frontend
    argocd-image-updater.argoproj.io/git-commit-message: "chore(frontend): update image to {{new_tag}} ({{new_digest}})"
spec:
  project: urlshortener
  sources:
    - repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/frontend
      chart: frontend
      targetRevision: 0.1.2
      helm:
        valueFiles:
          - $values/k8s/values/frontend.values.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/andreistefanciprian/urlshortener.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

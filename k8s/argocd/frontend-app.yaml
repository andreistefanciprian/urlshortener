apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Image updates managed by Renovate; removed Argo CD Image Updater annotations
spec:
  project: urlshortener
  source:
    repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/frontend
    chart: frontend
    targetRevision: 0.1.4
    helm:
      values: |
        image:
          repository: andreistefanciprian/urlshortener-frontend
          tag: latest@sha256:27c1634a68ea9a29e9a80045509b03a52d26e300a739c7bab244bc1ade38ddf8
        config:
          LOG_LEVEL: DEBUG
          BACKEND_HOST: api-gateway.api-gateway.svc
          BACKEND_PORT: "8080"
          FRONTEND_PORT: "8090"
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

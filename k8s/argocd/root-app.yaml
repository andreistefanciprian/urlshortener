apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: urlshortener-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: urlshortener
  source:
    repoURL: https://github.com/andreistefanciprian/urlshortener.git
    targetRevision: main
    path: k8s/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

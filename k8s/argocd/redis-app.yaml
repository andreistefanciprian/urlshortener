apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: urlshortener
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    # Set this to the exact chart version you want to deploy (example below)
    targetRevision: 23.2.2
    helm:
      values: |
        architecture: standalone
        auth:
          enabled: true
          existingSecret: redis-creds
          existingSecretPasswordKey: redis-password
        master:
          persistence:
            enabled: true
            size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-gen
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd-image-updater.argoproj.io/image-list: urlgen=andreistefanciprian/urlshortener-url-gen
    argocd-image-updater.argoproj.io/urlgen.update-strategy: digest
    argocd-image-updater.argoproj.io/urlgen.helm.parameters: "-p image.repository=%(image) -p image.digest=%(digest)"
spec:
  project: urlshortener
  sources:
    - repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/url-gen
      chart: url-gen
      targetRevision: 0.1.7
      helm:
        valueFiles:
          - $values/url-gen.values.yaml
    - repoURL: https://github.com/andreistefanciprian/urlshortener.git
      targetRevision: main
      ref: values
      path: k8s/values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-gen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

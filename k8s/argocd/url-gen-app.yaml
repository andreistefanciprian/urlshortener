apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-gen
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Removed Argo CD Image Updater annotations; Renovate will manage image digests
spec:
  project: urlshortener
  source:
    repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/url-gen
    chart: url-gen
    targetRevision: 0.1.7
    helm:
      values: |
        image:
          repository: andreistefanciprian/urlshortener-url-gen
          tag: latest@sha256:3607fd07fc367d0eda14e02ae900ca71db3f90438cc709c611523d046b4eefd3
        config:
          LOG_LEVEL: DEBUG
          DB_HOST: postgres-postgresql.postgres.svc
          DB_USER: url_gen_user
          REDIS_HOST: redis-master.redis.svc
          REDIS_DB: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: url-gen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

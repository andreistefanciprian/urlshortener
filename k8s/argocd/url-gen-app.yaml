apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-gen
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Removed Argo CD Image Updater annotations; Renovate will manage image digests
spec:
  project: urlshortener
  sources:
    - repoURL: oci://ghcr.io/andreistefanciprian/urlshortener/url-gen
      chart: url-gen
      targetRevision: 0.1.7
      helm:
        valueFiles:
          - $values/k8s/values/url-gen.values.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/andreistefanciprian/urlshortener.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-gen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
